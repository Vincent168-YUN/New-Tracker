<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for the summary section */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        
        /* Hide number input spinners */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        /* Pulsing highlight animation for calendar days matching a selected category */
        @keyframes categoryPulse {
            0% { box-shadow: 0 0 0 0 var(--pulse-color, rgba(255,59,48,0.6)); }
            70% { box-shadow: 0 0 0 10px rgba(255,59,48,0); }
            100% { box-shadow: 0 0 0 0 rgba(255,59,48,0); }
        }
        .category-highlight-day {
            animation: categoryPulse 1.4s ease-out infinite;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center py-10 px-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-[380px] overflow-hidden border border-gray-100">
        
        <div class="flex items-center justify-between px-6 py-5">
            <div class="flex items-center space-x-2">
                <button onclick="changeMonth(-1)" class="text-red-500 hover:text-red-600 focus:outline-none text-2xl font-light select-none">&lt;</button>
                <h1 id="month-display" class="text-3xl font-bold text-gray-900 tracking-tight">March</h1>
                <button onclick="changeMonth(1)" class="text-red-500 hover:text-red-600 focus:outline-none text-2xl font-light select-none">&gt;</button>
                <span id="year-display" class="text-gray-400 text-sm ml-1 font-medium hidden">2026</span>
            </div>
            
            <div class="flex items-center space-x-3">
                <button onclick="exportToCSV()" class="text-gray-400 hover:text-gray-600 focus:outline-none transition-colors" title="Export Month to CSV">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                    </svg>
                </button>
                <button onclick="handleLogout()" class="text-red-500 hover:text-red-600 focus:outline-none transition-colors" title="Sign Out">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                </button>
            </div>
        </div>

        <div class="px-6 pb-2">
            <div class="grid grid-cols-7 gap-1 text-center mb-2">
                <div class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider">S</div>
                <div class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider">M</div>
                <div class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider">T</div>
                <div class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider">W</div>
                <div class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider">T</div>
                <div class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider">F</div>
                <div class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider">S</div>
            </div>
            <div id="calendar-days" class="grid grid-cols-7 gap-y-2 gap-x-1 text-center"></div>
        </div>

        <div class="border-t border-gray-100 bg-gray-50/50 px-6 py-4 flex justify-between items-center mt-2">
            <div id="selected-date-text" class="text-[15px] font-medium text-gray-800">Loading...</div>
            <div id="daily-total" class="text-[15px] font-medium text-gray-500">$0.00</div>
        </div>

        <div class="px-6 py-4 bg-gray-50/50 border-t border-gray-100 flex flex-col space-y-2">
            <div class="flex items-center space-x-2">
                <div class="relative flex-1 flex shadow-sm rounded-lg">
                    <select id="expense-category" onchange="toggleCustomCategory()" class="flex-1 bg-white border border-gray-200 text-gray-700 text-sm rounded-l-lg focus:ring-red-500 focus:border-red-500 block w-full p-2.5 outline-none appearance-none cursor-pointer border-r-0 truncate">
                        <!-- Options injected by JS -->
                    </select>
                    <button onclick="openCategoryManager()" class="bg-white border border-gray-200 border-l-0 text-gray-400 hover:text-gray-600 hover:bg-gray-50 rounded-r-lg px-2 focus:outline-none transition-colors" title="Manage Categories">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                    </button>
                </div>
                
                <div class="relative w-24 shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none">
                        <span class="text-gray-500 sm:text-sm">$</span>
                    </div>
                    <input type="number" id="expense-amount" step="0.01" min="0" class="bg-white border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-red-500 focus:border-red-500 block w-full pl-6 pr-2 py-2.5 outline-none" placeholder="0.00">
                </div>

                <button onclick="addExpense()" class="text-white bg-[#ff3b30] hover:bg-red-600 focus:ring-4 focus:ring-red-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center transition-colors shadow-sm">
                    Add
                </button>
            </div>
            
            <input type="text" id="custom-category" class="hidden bg-white border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-red-500 focus:border-red-500 block w-full p-2.5 outline-none shadow-sm transition-all" placeholder="Specify the expense type...">
        </div>

        <div class="px-6 py-2 bg-white">
            <ul id="daily-expense-list" class="space-y-2 max-h-32 overflow-y-auto pr-1"></ul>
        </div>

        <div class="border-t border-gray-200 px-6 py-5 bg-white">
            <div class="flex justify-between items-end mb-4">
                <h3 class="text-[13px] font-extrabold text-gray-800 uppercase tracking-wider">Expense By Category</h3>
            </div>
            
            <div class="bg-gray-50 rounded-xl p-3 mb-4 border border-gray-100">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <div class="text-[10px] text-gray-500 font-bold uppercase tracking-wider mb-0.5">Income</div>
                        <div class="relative flex items-center">
                            <span class="text-gray-500 font-medium mr-1">$</span>
                            <input type="number" id="monthly-income-input" 
                                   onfocus="this.classList.remove('blur-[5px]')"
                                   onblur="this.classList.add('blur-[5px]')"
                                   class="bg-transparent text-green-600 font-bold text-lg w-full outline-none blur-[5px] transition-all duration-300 cursor-pointer" 
                                   placeholder="0.00" onchange="updateIncome()">
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-0.5">Spent</div>
                        <div id="monthly-total" class="text-lg font-bold text-[#ff3b30] leading-none mt-1">$0.00</div>
                    </div>
                    <div class="col-span-2 pt-2 border-t border-gray-200 mt-1 flex justify-between items-center">
                         <div class="text-[10px] text-gray-500 font-bold uppercase tracking-wider">Remaining Balance</div>
                         <div id="remaining-balance" onclick="this.classList.remove('blur-[5px]')" class="text-xl font-bold text-gray-900 blur-[5px] transition-all duration-300 cursor-pointer select-none" title="Tap to toggle visibility">$0.00</div>
                    </div>
                </div>
            </div>
            
            <div id="category-list" class="w-full pb-2 pt-4 mt-2">
                <div class="text-sm text-center text-gray-400 py-4 italic w-full" id="loading-state">Loading cloud database...</div>
            </div>
        </div>
    </div>

    <!-- Category Manager Modal -->
    <div id="category-modal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-[340px] overflow-hidden flex flex-col max-h-[80vh]">
            <div class="px-5 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                <h3 class="font-bold text-gray-800">Manage Categories</h3>
                <button onclick="closeCategoryManager()" class="text-gray-400 hover:text-gray-600 focus:outline-none">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-4 border-b border-gray-100 flex space-x-2">
                <input type="text" id="new-category-input" class="flex-1 bg-white border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-red-500 focus:border-red-500 block p-2 outline-none shadow-sm" placeholder="New category name...">
                <button onclick="handleAddCategory()" class="bg-[#ff3b30] hover:bg-red-600 text-white text-sm font-medium px-4 rounded-lg transition-colors shadow-sm focus:ring-2 focus:ring-red-300 outline-none">Add</button>
            </div>
            <ul id="category-manager-list" class="overflow-y-auto p-4 space-y-2 flex-1">
                <!-- Rendered via JS -->
            </ul>
        </div>
    </div>

    <!-- Auth Modal (NEW) -->
    <div id="auth-modal" class="fixed inset-0 bg-gray-100 z-50 flex items-center justify-center p-4 transition-opacity">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-[340px] overflow-hidden p-6 space-y-4">
            <h2 class="text-2xl font-bold text-gray-900 text-center">Expense Tracker</h2>
            <p class="text-xs text-gray-500 text-center mb-4">Create an account or login to sync your expenses across all devices.</p>
            
            <div id="auth-error" class="text-[#ff3b30] bg-red-50 p-2 rounded text-xs font-medium text-center hidden border border-red-100"></div>
            
            <div class="space-y-3">
                <input type="email" id="auth-email" class="bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-red-500 focus:border-red-500 block w-full p-2.5 outline-none transition-colors" placeholder="Email address">
                <input type="password" id="auth-password" class="bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-red-500 focus:border-red-500 block w-full p-2.5 outline-none transition-colors" placeholder="Password">
            </div>
            
            <div class="flex space-x-2 pt-2">
                <button onclick="handleLogin()" class="flex-1 bg-gray-900 hover:bg-black text-white text-sm font-medium py-2.5 rounded-lg transition-colors shadow-sm">Login</button>
                <button onclick="handleSignup()" class="flex-1 bg-[#ff3b30] hover:bg-red-600 text-white text-sm font-medium py-2.5 rounded-lg transition-colors shadow-sm">Sign Up</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, setDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // =========================================================================
        // STANDALONE FIREBASE CONFIGURATION (For Vercel/GitHub)
        // =========================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBoUPFJZn5vnREHkc3PRjwAoooMGy6Vqgk",
            authDomain: "new-tracker-552fb.firebaseapp.com",
            projectId: "new-tracker-552fb",
            storageBucket: "new-tracker-552fb.firebasestorage.app",
            messagingSenderId: "579534758798",
            appId: "1:579534758798:web:28b2316c74467dc2e03adf"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // Hardcoded App ID so your Vercel app saves data to a consistent place
        const appId = 'my-expense-tracker'; 
        
        let currentUser = null;
        let unsubscribeSnap = null;
        let unsubscribeIncomesSnap = null;
        // =========================================================================

        const defaultCategories = ["Food/Drinks", "Parking", "Grocery", "Event", "Beer", "Online shopping", "Vehicle Care", "Data plan", "Gift", "Fitness", "Family", "Contact lens", "Hair cut", "Coffee bean and Milk", "Travel", "Gasoline", "Wife", "Harry", "Other"].sort((a, b) => a.localeCompare(b));
        let userCategories = [...defaultCategories];
        let unsubscribeCategoriesSnap = null;

        let expenses = {}; 
        let monthlyIncomes = {};
        let currentDate = new Date(); 
        let currentMonth = currentDate.getMonth();
        let currentYear = currentDate.getFullYear();
        let selectedDateStr = formatDate(currentDate);

        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

        // Auth Functions
        window.handleLogin = async function() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const errEl = document.getElementById('auth-error');
            
            if (!email || !password) {
                errEl.innerText = "Please enter both email and password.";
                errEl.classList.remove('hidden');
                return;
            }
            
            try {
                await signInWithEmailAndPassword(auth, email, password);
                errEl.classList.add('hidden');
            } catch (error) {
                errEl.innerText = error.message.replace('Firebase: ', '');
                errEl.classList.remove('hidden');
            }
        };

        window.handleSignup = async function() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const errEl = document.getElementById('auth-error');
            
            if (!email || !password) {
                errEl.innerText = "Please enter both email and password.";
                errEl.classList.remove('hidden');
                return;
            }
            
            try {
                await createUserWithEmailAndPassword(auth, email, password);
                errEl.classList.add('hidden');
            } catch (error) {
                errEl.innerText = error.message.replace('Firebase: ', '');
                errEl.classList.remove('hidden');
            }
        };

        window.handleLogout = function() {
            signOut(auth);
        };

        onAuthStateChanged(auth, (user) => {
            // Force log out if the user is using an old anonymous session
            if (user && user.isAnonymous) {
                signOut(auth);
                return;
            }

            currentUser = user;
            if (user) {
                document.getElementById('auth-modal').classList.add('hidden');
                autoDeleteOldData(user.uid);
                loadExpenses(user.uid);
            } else {
                document.getElementById('auth-modal').classList.remove('hidden');
                document.getElementById('auth-password').value = ''; // Clear password field
                
                expenses = {};
                monthlyIncomes = {};
                userCategories = [...defaultCategories];
                renderCategoryDropdown();
                renderCalendar();
                updateSelectedDayUI();
                updateDailyExpensesUI();
                updateMonthlySummaryUI();
                
                // FIX: Check if element exists before modifying to prevent crash
                const loadingState = document.getElementById('loading-state');
                if (loadingState) {
                    loadingState.innerText = "Please log in to load your data.";
                }
            }
        });

        async function autoDeleteOldData(userId) {
            // Calculate the date exactly 12 months ago
            const oneYearAgo = new Date();
            oneYearAgo.setFullYear(oneYearAgo.getFullYear() - 1);
            const cutoffDateStr = formatDate(oneYearAgo); // e.g. "2025-04-04"
            const cutoffMonthStr = cutoffDateStr.substring(0, 7); // e.g. "2025-04"

            try {
                // 1. Fetch and delete expenses older than 1 year
                const expensesRef = collection(db, 'artifacts', appId, 'users', userId, 'expenses');
                const expSnapshot = await getDocs(expensesRef);
                
                expSnapshot.forEach((document) => {
                    const data = document.data();
                    // String comparison works perfectly for YYYY-MM-DD formats
                    if (data.date && data.date < cutoffDateStr) {
                        deleteDoc(doc(db, 'artifacts', appId, 'users', userId, 'expenses', document.id));
                    }
                });

                // 2. Fetch and delete monthly income limits older than 1 year
                const incomesRef = collection(db, 'artifacts', appId, 'users', userId, 'incomes');
                const incSnapshot = await getDocs(incomesRef);
                
                incSnapshot.forEach((document) => {
                    // Income document IDs are formatted as "YYYY-MM"
                    if (document.id < cutoffMonthStr) {
                        deleteDoc(doc(db, 'artifacts', appId, 'users', userId, 'incomes', document.id));
                    }
                });
            } catch (error) {
                console.error("Error pruning old data:", error);
            }
        }

        function loadExpenses(userId) {
            if (unsubscribeSnap) unsubscribeSnap();
            if (unsubscribeIncomesSnap) unsubscribeIncomesSnap();
            if (unsubscribeCategoriesSnap) unsubscribeCategoriesSnap();
            
            // STRICT PATH: artifacts/{appId}/users/{userId}/{collectionName}
            const expensesRef = collection(db, 'artifacts', appId, 'users', userId, 'expenses');
            
            // NO COMPLEX QUERIES: Fetch everything, sort in memory
            unsubscribeSnap = onSnapshot(expensesRef, (snapshot) => {
                expenses = {}; 
                let tempExps = [];
                
                snapshot.forEach((document) => {
                    tempExps.push({ id: document.id, ...document.data() });
                });

                // In-memory sort safely handling string dates, Firebase Timestamps, and missing values
                tempExps.sort((a, b) => {
                    const getMs = (val) => {
                        if (!val) return 0;
                        if (typeof val.toMillis === 'function') return val.toMillis();
                        if (typeof val.toDate === 'function') return val.toDate().getTime();
                        const ms = new Date(val).getTime();
                        return isNaN(ms) ? 0 : ms;
                    };
                    return getMs(a.createdAt) - getMs(b.createdAt);
                });

                tempExps.forEach(data => {
                    if (!expenses[data.date]) {
                        expenses[data.date] = [];
                    }
                    expenses[data.date].push({ id: data.id, category: data.category, amount: data.amount });
                });
                
                // FIX: Hide instead of remove to prevent later null reference errors
                const loadingState = document.getElementById('loading-state');
                if (loadingState) loadingState.style.display = 'none'; 
                
                renderCalendar();
                updateSelectedDayUI();
                updateDailyExpensesUI();
                updateMonthlySummaryUI();
            }, (error) => {
                console.error("Snapshot Error:", error);
                const loadingState = document.getElementById('loading-state');
                if (loadingState) {
                    loadingState.style.display = 'block';
                    loadingState.innerHTML = `<div class="text-red-500 text-xs font-bold bg-red-50 p-2 rounded border border-red-100">Database Blocked: ${error.message}<br>Please update your Firebase Security Rules.</div>`;
                }
            });

            const incomesRef = collection(db, 'artifacts', appId, 'users', userId, 'incomes');
            unsubscribeIncomesSnap = onSnapshot(incomesRef, (snapshot) => {
                monthlyIncomes = {};
                snapshot.forEach((doc) => {
                    monthlyIncomes[doc.id] = doc.data().amount || 0;
                });
                updateMonthlySummaryUI();
            }, (error) => {
                console.error("Incomes Snapshot Error:", error);
            });

            // Load Custom Categories
            const categoriesRef = doc(db, 'artifacts', appId, 'users', userId, 'preferences', 'categories');
            unsubscribeCategoriesSnap = onSnapshot(categoriesRef, (docSnap) => {
                if (docSnap.exists() && docSnap.data().list) {
                    userCategories = docSnap.data().list.sort((a, b) => a.localeCompare(b));
                } else {
                    userCategories = [...defaultCategories];
                }
                renderCategoryDropdown();
                if (!document.getElementById('category-modal').classList.contains('hidden')) {
                    renderCategoryManagerList();
                }
            }, (error) => {
                console.error("Categories Snapshot Error:", error);
            });
        }

        function formatDate(date) {
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        function formatCurrency(amount) {
            return '$' + parseFloat(amount).toFixed(2);
        }

        function hexToRgba(hex, alpha) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        window.changeMonth = function(direction) {
            currentMonth += direction;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            window.selectDate(new Date(currentYear, currentMonth, 1));
        };

        window.selectDate = function(dateObj) {
            currentDate = dateObj;
            selectedDateStr = formatDate(currentDate);
            renderCalendar();
            updateSelectedDayUI();
            updateDailyExpensesUI();
            updateMonthlySummaryUI();
        };

        window.toggleCustomCategory = function() {
            const categorySelect = document.getElementById('expense-category');
            const customInput = document.getElementById('custom-category');
            if (categorySelect.value === 'Other') {
                customInput.classList.remove('hidden');
                customInput.focus();
            } else {
                customInput.classList.add('hidden');
                customInput.value = '';
            }
        };

        window.addExpense = async function() {
            if (!currentUser) {
                alert("Authentication required. Please check the error at the bottom of the summary or ensure Anonymous Sign-In is enabled in Firebase.");
                return; // Guard clause
            }
            
            const categorySelect = document.getElementById('expense-category');
            const customInput = document.getElementById('custom-category');
            const amountInput = document.getElementById('expense-amount');
            
            let category = categorySelect.value;
            if (category === 'Other') {
                const customVal = customInput.value.trim();
                category = customVal !== '' ? customVal : 'Other';
            }

            const amount = parseFloat(amountInput.value);

            if (isNaN(amount) || amount <= 0) {
                amountInput.classList.add('border-red-500', 'animate-pulse');
                setTimeout(() => amountInput.classList.remove('border-red-500', 'animate-pulse'), 1000);
                return;
            }

            try {
                const expensesRef = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'expenses');
                await addDoc(expensesRef, {
                    date: selectedDateStr,
                    category: category,
                    amount: amount,
                    createdAt: new Date().toISOString() // Save ISO string for easy in-memory sorting
                });

                amountInput.value = '';
                customInput.value = '';
                customInput.classList.add('hidden');
                
                // Reset category select safely
                if (userCategories.length > 0) {
                    categorySelect.value = userCategories;
                }
            } catch (error) {
                console.error("Error adding document: ", error);
            }
        };

        window.deleteCategoryExpenses = async function(category) {
            if (!currentUser) return; // Guard clause
            
            const dailyExps = expenses[selectedDateStr] || [];
            const expsToDelete = dailyExps.filter(exp => exp.category === category);
            
            for (const exp of expsToDelete) {
                if (!exp || !exp.id) continue;
                try {
                    const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'expenses', exp.id);
                    await deleteDoc(docRef);
                } catch (error) {
                    console.error("Error deleting document: ", error);
                }
            }
        };

        window.deleteSingleExpense = async function(expId) {
            if (!currentUser || !expId) return;
            try {
                const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'expenses', expId);
                await deleteDoc(docRef);
            } catch (error) {
                console.error("Error deleting single document: ", error);
            }
        };

        document.getElementById('expense-amount').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') window.addExpense();
        });

        // Global click listener to re-blur remaining balance when clicking anywhere else
        document.addEventListener('click', function(e) {
            const remainingEl = document.getElementById('remaining-balance');
            if (remainingEl && e.target !== remainingEl) {
                remainingEl.classList.add('blur-[5px]');
            }
        });

        window.updateIncome = async function() {
            if (!currentUser) return;
            const input = document.getElementById('monthly-income-input');
            const newAmount = parseFloat(input.value) || 0;
            const targetMonthPrefix = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;
            
            try {
                const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'incomes', targetMonthPrefix);
                await setDoc(docRef, { amount: newAmount }, { merge: true });
            } catch (error) {
                console.error("Error updating income: ", error);
            }
        };

        function renderCalendar() {
            document.getElementById('month-display').innerText = monthNames[currentMonth];
            document.getElementById('year-display').innerText = currentYear;
            
            const yearDisplay = document.getElementById('year-display');
            if (currentYear !== new Date().getFullYear()) {
                yearDisplay.classList.remove('hidden');
            } else {
                yearDisplay.classList.add('hidden');
            }

            const daysContainer = document.getElementById('calendar-days');
            daysContainer.innerHTML = '';

            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                const emptySlot = document.createElement('div');
                daysContainer.appendChild(emptySlot);
            }

            for (let i = 1; i <= daysInMonth; i++) {
                const dayDate = new Date(currentYear, currentMonth, i);
                const dayStr = formatDate(dayDate);
                const isSelected = dayStr === selectedDateStr;
                const hasExpenses = expenses[dayStr] && expenses[dayStr].length > 0;

                const dayBtn = document.createElement('button');
                dayBtn.onclick = () => window.selectDate(dayDate);
                
                let classes = "relative w-9 h-9 mx-auto flex items-center justify-center rounded-full text-[15px] transition-all duration-200 outline-none ";
                
                if (isSelected) {
                    classes += "bg-[#ff3b30] text-white font-bold shadow-md transform scale-105";
                } else {
                    classes += "text-gray-700 hover:bg-gray-200";
                }

                dayBtn.className = classes;
                dayBtn.innerText = i;

                if (hasExpenses && !isSelected) {
                    const dot = document.createElement('div');
                    dot.className = "absolute bottom-1 w-1 h-1 bg-red-400 rounded-full";
                    dayBtn.appendChild(dot);
                }

                // Pulsing highlight ring for days matching the currently selected category filter
                if (window.selectedCategoryFilter && hasExpenses) {
                    const matchesCategory = expenses[dayStr].some(exp => exp.category === window.selectedCategoryFilter);
                    if (matchesCategory) {
                        const color = (window.categoryColorMap && window.categoryColorMap[window.selectedCategoryFilter]) || '#ff3b30';
                        dayBtn.classList.add('category-highlight-day');
                        dayBtn.style.setProperty('--pulse-color', hexToRgba(color, 0.55));
                        dayBtn.style.border = `2px solid ${color}`;
                        if (!isSelected) {
                            dayBtn.style.color = color;
                            dayBtn.style.fontWeight = '700';
                        }
                    }
                }

                daysContainer.appendChild(dayBtn);
            }
        }

        function updateSelectedDayUI() {
            const dayName = dayNames[currentDate.getDay()];
            const monthName = monthNames[currentDate.getMonth()];
            const dayNum = currentDate.getDate();
            document.getElementById('selected-date-text').innerText = `${dayName}, ${monthName} ${dayNum}`;

            let dailyTotal = 0;
            if (expenses[selectedDateStr]) {
                dailyTotal = expenses[selectedDateStr].reduce((sum, item) => sum + item.amount, 0);
            }
            document.getElementById('daily-total').innerText = formatCurrency(dailyTotal);
        }

        function updateDailyExpensesUI() {
            const listContainer = document.getElementById('daily-expense-list');
            listContainer.innerHTML = ''; 

            const dailyExps = expenses[selectedDateStr] || [];
            
            if (dailyExps.length === 0) return; 

            // Group expenses by category
            const categoryGroups = {};
            dailyExps.forEach((exp) => {
                if (!categoryGroups[exp.category]) {
                    categoryGroups[exp.category] = { total: 0, items: [] };
                }
                categoryGroups[exp.category].total += exp.amount;
                categoryGroups[exp.category].items.push(exp);
            });

            Object.keys(categoryGroups).forEach((category, catIndex) => {
                const group = categoryGroups[category];
                const li = document.createElement('li');
                li.className = "flex flex-col bg-gray-50 rounded-md border border-gray-100 overflow-hidden text-sm";
                
                // Add a small badge if there are multiple entries for this category today
                const countBadge = group.items.length > 1 ? `<span class="text-[10px] text-gray-400 bg-gray-200 px-1.5 py-0.5 rounded-md ml-1.5">x${group.items.length}</span>` : '';

                const uniqueId = `cat-details-${catIndex}`;
                const iconId = `cat-icon-${catIndex}`;

                let itemsHtml = '';
                group.items.forEach((item) => {
                    itemsHtml += `
                        <div class="flex justify-between items-center py-1.5 pl-9 pr-3 border-t border-gray-100 bg-gray-100/50 hover:bg-gray-200/50 transition-colors">
                            <span class="text-gray-500 text-xs font-medium">${formatCurrency(item.amount)}</span>
                            <button onclick="window.deleteSingleExpense('${item.id}'); event.stopPropagation();" class="text-gray-400 hover:text-red-500 focus:outline-none transition-colors" title="Delete this specific entry">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                                </svg>
                            </button>
                        </div>
                    `;
                });

                li.innerHTML = `
                    <div class="flex justify-between items-center px-3 py-2 cursor-pointer hover:bg-gray-100 transition-colors" onclick="document.getElementById('${uniqueId}').classList.toggle('hidden'); document.getElementById('${iconId}').classList.toggle('rotate-180');">
                        <div class="flex items-center">
                            <svg id="${iconId}" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400 mr-1.5 transition-transform duration-200 ${group.items.length > 1 ? '' : 'opacity-40'}" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                            </svg>
                            <span class="text-gray-700 font-medium">${category}</span>
                            ${countBadge}
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="font-semibold text-gray-800">${formatCurrency(group.total)}</span>
                            <button onclick="window.deleteCategoryExpenses('${category.replace(/'/g, "\\'")}'); event.stopPropagation();" class="text-gray-400 hover:text-red-500 focus:outline-none transition-colors" title="Delete All ${category} Today">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div id="${uniqueId}" class="hidden flex-col">
                        ${itemsHtml}
                    </div>
                `;
                listContainer.appendChild(li);
            });
        }

        // --- GLOBALS FOR PIE CHART / CATEGORY INTERACTION ---
        window.currentPieSlices = [];
        window.currentCategoryList = [];
        window.categoryColorMap = {};
        window.selectedCategoryFilter = null;
        
        window.highlightLegendItem = function(index) {
            const category = window.currentCategoryList ? window.currentCategoryList[index] : null;

            // Toggle off if the same category is clicked again
            if (window.selectedCategoryFilter && window.selectedCategoryFilter === category) {
                window.selectedCategoryFilter = null;
                document.querySelectorAll('.legend-item').forEach(el => {
                    el.classList.remove('bg-white', 'scale-[1.03]', 'shadow-md', 'border-gray-200', 'z-10', 'relative');
                    el.classList.add('border-transparent');
                });
                renderCalendar();
                return;
            }

            window.selectedCategoryFilter = category;

            // Remove highlight from all items
            document.querySelectorAll('.legend-item').forEach(el => {
                el.classList.remove('bg-white', 'scale-[1.03]', 'shadow-md', 'border-gray-200', 'z-10', 'relative');
                el.classList.add('border-transparent');
            });
            // Apply highlight to the targeted item
            const target = document.getElementById(`legend-item-${index}`);
            if (target) {
                target.classList.remove('border-transparent');
                target.classList.add('bg-white', 'scale-[1.03]', 'shadow-md', 'border-gray-200', 'z-10', 'relative');
                // Ensure the highlighted item scrolls smoothly into view
                target.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            // Re-render the calendar so the exact spend dates for this category pulse into view
            renderCalendar();
        };

        window.handlePieClick = function(e) {
            // Calculate where on the pie chart the user clicked
            const rect = e.currentTarget.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            // Calculate angle from center using trigonometry
            let angle = Math.atan2(y, x) * 180 / Math.PI; 
            angle = angle + 90; // Shift to 12 o'clock
            if (angle < 0) angle += 360; 
            
            const percent = (angle / 360) * 100;

            // Find which category slice this percentage falls into
            const slice = window.currentPieSlices.find(s => percent >= s.start && percent <= s.end);
            if (slice) {
                window.highlightLegendItem(slice.index);
            }
        };
        // ---------------------------------------------

        function updateMonthlySummaryUI() {
            const listContainer = document.getElementById('category-list');
            
            // Only clear it if we have finished loading to prevent removing the loading text early
            if(currentUser) listContainer.innerHTML = ''; 

            let monthlyTotal = 0;
            const categoryTotals = {};
            const targetMonthPrefix = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;

            for (const dateStr in expenses) {
                if (dateStr.startsWith(targetMonthPrefix)) {
                    expenses[dateStr].forEach(expense => {
                        monthlyTotal += expense.amount;
                        if (!categoryTotals[expense.category]) {
                            categoryTotals[expense.category] = 0;
                        }
                        categoryTotals[expense.category] += expense.amount;
                    });
                }
            }

            document.getElementById('monthly-total').innerText = formatCurrency(monthlyTotal);

            const currentIncome = monthlyIncomes[targetMonthPrefix] || 0;
            const incomeInput = document.getElementById('monthly-income-input');
            
            if (incomeInput && document.activeElement !== incomeInput) {
                incomeInput.value = currentIncome > 0 ? currentIncome : '';
            }

            const remaining = currentIncome - monthlyTotal;
            const remainingEl = document.getElementById('remaining-balance');
            
            if (remainingEl) {
                const isNegative = remaining < 0;
                remainingEl.innerText = (isNegative ? '-' : '') + formatCurrency(Math.abs(remaining));
                
                // Force blur to reset whenever the UI updates (like adding an expense)
                if (isNegative) {
                    remainingEl.className = `text-xl font-bold text-[#ff3b30] blur-[5px] transition-all duration-300 cursor-pointer select-none`;
                } else {
                    remainingEl.className = `text-xl font-bold text-green-500 blur-[5px] transition-all duration-300 cursor-pointer select-none`;
                }
            }

            const categories = Object.keys(categoryTotals);
            
            if (categories.length === 0 && currentUser) {
                listContainer.innerHTML = '<div class="text-sm text-center text-gray-400 py-4 italic w-full">No expenses recorded this month.</div>';
                listContainer.className = "w-full flex items-center justify-center pb-2 pl-4 pt-2 mt-4";
                return;
            }

            // Apply chart layout classes for pie chart layout
            listContainer.className = "w-full pb-2 pt-5 mt-2";

            categories.sort((a, b) => categoryTotals[b] - categoryTotals[a]);

            // Authentic iOS System Color Palette for premium feel
            const pieColors = ['#FF3B30', '#007AFF', '#FFCC00', '#34C759', '#AF52DE', '#FF9500', '#5AC8FA', '#FF2D55', '#5856D6', '#8E8E93'];

            let gradientStops = [];
            let currentPercent = 0;
            window.currentPieSlices = []; // Reset slice math data
            window.currentCategoryList = categories; // Track category order for legend/calendar linkage
            window.categoryColorMap = {}; // Track colors so calendar highlight matches the pie/legend
            
            // Add a subtle container background for the legend items
            let legendHTML = '<div class="mt-8 space-y-1 px-1 max-h-48 overflow-y-auto scrollbar-thin rounded-xl p-1.5 bg-gray-50/50 border border-gray-100/80">';

            categories.forEach((cat, index) => {
                const total = categoryTotals[cat];
                const percent = monthlyTotal > 0 ? (total / monthlyTotal) * 100 : 0;
                const color = pieColors[index % pieColors.length];
                window.categoryColorMap[cat] = color;

                // Build the conic-gradient string
                gradientStops.push(`${color} ${currentPercent}% ${currentPercent + percent}%`);
                
                // Save boundary math data for click/touch detection
                window.currentPieSlices.push({ start: currentPercent, end: currentPercent + percent, index: index });

                currentPercent += percent;

                // Build interactive legend item with animation classes
                const displayPercent = percent.toFixed(1);
                legendHTML += `
                    <div id="legend-item-${index}" class="legend-item flex items-center justify-between text-sm group border border-transparent p-2.5 rounded-xl transition-all duration-300 cursor-pointer" onclick="highlightLegendItem(${index})">
                        <div class="flex items-center space-x-3 overflow-hidden pr-2 pointer-events-none">
                            <div class="w-3.5 h-3.5 rounded-full flex-shrink-0 shadow-sm" style="background-color: ${color};"></div>
                            <span class="text-gray-700 font-medium truncate group-hover:text-gray-900 transition-colors">${cat}</span>
                        </div>
                        <div class="flex items-center space-x-2 flex-shrink-0 pointer-events-none">
                            <span class="text-gray-400 text-[11px] font-semibold w-10 text-right">${displayPercent}%</span>
                            <span class="font-extrabold text-gray-800 text-[13px] w-16 text-right">${formatCurrency(total)}</span>
                        </div>
                    </div>
                `;
            });

            legendHTML += '</div>';

            // Construct the Clean Minimalist Pie Chart layout with iOS Liquid Glass look
            listContainer.innerHTML = `
                <div class="flex flex-col items-center w-full">
                    <div class="relative w-48 h-48 rounded-full shadow-[0_15px_35px_-5px_rgba(0,0,0,0.15),0_8px_10px_-6px_rgba(0,0,0,0.1)] flex items-center justify-center cursor-pointer transition-transform duration-300 hover:scale-[1.02] active:scale-[0.98] border-[4px] border-white" 
                         style="background: conic-gradient(${gradientStops.join(', ')});"
                         onclick="handlePieClick(event)">
                        <!-- Glass overlay for 3D glossy bevel effect -->
                        <div class="absolute inset-0 rounded-full shadow-[inset_0_12px_24px_rgba(255,255,255,0.4),inset_0_-8px_16px_rgba(0,0,0,0.1)] pointer-events-none"></div>
                    </div>
                    <div class="w-full mt-2">
                        ${legendHTML}
                    </div>
                </div>
            `;

            // If a category is still selected while browsing months, keep its legend item highlighted
            if (window.selectedCategoryFilter && categories.includes(window.selectedCategoryFilter)) {
                const idx = categories.indexOf(window.selectedCategoryFilter);
                const target = document.getElementById(`legend-item-${idx}`);
                if (target) {
                    target.classList.remove('border-transparent');
                    target.classList.add('bg-white', 'scale-[1.03]', 'shadow-md', 'border-gray-200', 'z-10', 'relative');
                }
            }
        }

        window.exportToCSV = function() {
            const targetMonthPrefix = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;
            let csvContent = "data:text/csv;charset=utf-8,Date,Category,Amount\n";
            let hasData = false;

            const sortedDates = Object.keys(expenses).sort();

            for (const dateStr of sortedDates) {
                if (dateStr.startsWith(targetMonthPrefix)) {
                    expenses[dateStr].forEach(exp => {
                        hasData = true;
                        csvContent += `${dateStr},"${exp.category}",${exp.amount.toFixed(2)}\n`;
                    });
                }
            }

            if (!hasData) {
                alert(`No data to export for ${monthNames[currentMonth]} ${currentYear}`);
                return;
            }

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Expenses_${monthNames[currentMonth]}_${currentYear}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        // Category Management Logic
        window.openCategoryManager = function() {
            document.getElementById('category-modal').classList.remove('hidden');
            renderCategoryManagerList();
        };

        window.closeCategoryManager = function() {
            document.getElementById('category-modal').classList.add('hidden');
        };

        function renderCategoryDropdown() {
            const select = document.getElementById('expense-category');
            const currentVal = select.value;
            select.innerHTML = '';
            
            userCategories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                select.appendChild(opt);
            });
            
            if (userCategories.includes(currentVal)) {
                select.value = currentVal;
            } else if (userCategories.length > 0) {
                select.value = userCategories;
            }
            window.toggleCustomCategory();
        }

        window.handleAddCategory = async function() {
            if (!currentUser) return;
            const input = document.getElementById('new-category-input');
            const newCat = input.value.trim();
            
            if (!newCat || userCategories.includes(newCat)) return;
            
            const updatedList = [...userCategories, newCat].sort((a, b) => a.localeCompare(b));
            const categoriesRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'preferences', 'categories');
            
            // Disable button briefly to prevent double clicks
            const btn = event.currentTarget;
            btn.disabled = true;
            btn.innerHTML = '...';
            
            await setDoc(categoriesRef, { list: updatedList }, { merge: true });
            
            input.value = '';
            btn.disabled = false;
            btn.innerHTML = 'Add';
        };

        window.handleDeleteCategory = async function(catToRemove) {
            if (!currentUser) return;
            
            const updatedList = userCategories.filter(c => c !== catToRemove);
            const categoriesRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'preferences', 'categories');
            await setDoc(categoriesRef, { list: updatedList }, { merge: true });
        };

        function renderCategoryManagerList() {
            const listContainer = document.getElementById('category-manager-list');
            listContainer.innerHTML = '';
            
            if (userCategories.length === 0) {
                listContainer.innerHTML = '<div class="text-sm text-gray-400 text-center py-6">No categories left. Use the input above to add a new one!</div>';
                return;
            }

            userCategories.forEach(cat => {
                const li = document.createElement('li');
                li.className = "flex justify-between items-center py-2 px-3 bg-white hover:bg-gray-50 rounded-lg border border-gray-100 transition-colors";
                li.innerHTML = `
                    <span class="text-sm font-medium text-gray-700 truncate mr-2">${cat}</span>
                    <button onclick="window.handleDeleteCategory('${cat.replace(/'/g, "\\'")}')" class="text-gray-400 hover:text-[#ff3b30] focus:outline-none p-1 transition-colors flex-shrink-0" title="Delete Category">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                    </button>
                `;
                listContainer.appendChild(li);
            });
        }

        // Add event listener for Enter key in category manager input
        document.getElementById('new-category-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') window.handleAddCategory();
        });

        // Initialize UI
        renderCategoryDropdown();
        renderCalendar();
        updateSelectedDayUI();
    </script>
</body>
</html>
