<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for the summary section */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        
        /* Hide number input spinners */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        /* Hide number in income box until focused */
        .mask-income:not(:focus) {
            color: transparent;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.4);
        }
        @supports (-webkit-text-security: disc) {
            .mask-income:not(:focus) {
                color: inherit;
                text-shadow: none;
                -webkit-text-security: disc;
            }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center py-10 px-4">

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 flex flex-col space-y-2 z-50 pointer-events-none"></div>

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-[380px] overflow-hidden border border-gray-100">
        
        <div class="flex items-center justify-between px-6 py-5">
            <div class="flex items-center space-x-2">
                <button onclick="changeMonth(-1)" class="text-red-500 hover:text-red-600 focus:outline-none text-2xl font-light select-none">&lt;</button>
                <h1 id="month-display" class="text-3xl font-bold text-gray-900 tracking-tight">Month</h1>
                <button onclick="changeMonth(1)" class="text-red-500 hover:text-red-600 focus:outline-none text-2xl font-light select-none">&gt;</button>
                <span id="year-display" class="text-gray-400 text-sm ml-1 font-medium hidden">Year</span>
            </div>
            
            <div class="flex items-center space-x-3">
                <button onclick="exportToCSV()" class="text-red-500 hover:text-red-600 focus:outline-none transition-colors" title="Export Month to CSV">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                    </svg>
                </button>
            </div>
        </div>

        <div class="px-6 pb-2">
            <div class="grid grid-cols-7 gap-1 text-center mb-2">
                <div class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider">S</div>
                <div class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider">M</div>
                <div class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider">T</div>
                <div class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider">W</div>
                <div class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider">T</div>
                <div class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider">F</div>
                <div class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider">S</div>
            </div>
            <div id="calendar-days" class="grid grid-cols-7 gap-y-1 gap-x-1 text-center"></div>
        </div>

        <div class="border-t border-gray-100 bg-gray-50/50 px-6 py-4 flex justify-between items-center mt-2">
            <div id="selected-date-text" class="text-[15px] font-medium text-gray-800">Loading...</div>
            <div id="daily-total" class="text-[15px] font-medium text-gray-500">$0.00</div>
        </div>

        <div class="px-6 py-4 bg-gray-50/50 border-t border-gray-100 flex flex-col space-y-2">
            <div class="flex items-center space-x-2">
                <select id="expense-category" onchange="toggleCustomCategory()" class="flex-1 bg-white border border-gray-200 text-gray-700 text-sm rounded-lg focus:ring-red-500 focus:border-red-500 block w-full p-2.5 outline-none appearance-none shadow-sm cursor-pointer">
                    <option value="Food/Drinks">Food/Drinks</option>
                    <option value="Parking">Parking</option>
                    <option value="Grocery">Grocery</option>
                    <option value="Event">Event</option>
                    <option value="Beer">Beer</option>
                    <option value="Online shopping">Online shopping</option>
                    <option value="Vehicle Care">Vehicle Care</option>
                    <option value="Data plan">Data plan</option>
                    <option value="Gift">Gift</option>
                    <option value="Fitness">Fitness</option>
                    <option value="Family">Family</option>
                    <option value="Contact lens">Contact lens</option>
                    <option value="Hair cut">Hair cut</option>
                    <option value="Coffee bean and Milk">Coffee bean and Milk</option>
                    <option value="Travel">Travel</option>
                    <option value="Other">Other</option>
                </select>
                
                <div class="relative w-24 shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none">
                        <span class="text-gray-500 sm:text-sm">$</span>
                    </div>
                    <input type="number" id="expense-amount" step="0.01" min="0" class="bg-white border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-red-500 focus:border-red-500 block w-full pl-6 pr-2 py-2.5 outline-none" placeholder="0.00">
                </div>

                <button onclick="addExpense()" class="text-white bg-[#ff3b30] hover:bg-red-600 focus:ring-4 focus:ring-red-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center transition-colors shadow-sm">
                    Add
                </button>
            </div>
            
            <input type="text" id="custom-category" class="hidden bg-white border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-red-500 focus:border-red-500 block w-full p-2.5 outline-none shadow-sm transition-all" placeholder="Specify the expense type...">
        </div>

        <div class="px-6 py-2 bg-white">
            <ul id="daily-expense-list" class="space-y-2 max-h-32 overflow-y-auto pr-1"></ul>
        </div>

        <div class="border-t border-gray-200 px-6 py-5 bg-white">
            <h3 class="text-sm font-bold text-gray-800 uppercase tracking-wide mb-3">Monthly Summary</h3>
            
            <!-- Income and Balance Section -->
            <div class="grid grid-cols-3 gap-2 mb-4 bg-gray-50/80 p-3 rounded-lg border border-gray-100">
                <div>
                    <label class="text-[10px] text-gray-400 font-bold uppercase mb-1 block">Income</label>
                    <div class="relative shadow-sm">
                        <span class="absolute left-2 top-1 text-gray-400 text-xs font-medium">$</span>
                        <input type="number" id="monthly-income" class="mask-income w-full pl-4 pr-1 py-1 bg-white border border-gray-200 rounded text-xs font-medium text-gray-900 outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition-all" placeholder="0.00" onchange="saveIncome()">
                    </div>
                </div>
                <div class="text-center">
                    <div class="text-[10px] text-gray-400 font-bold uppercase mb-1">Spent</div>
                    <div id="monthly-total" class="text-sm font-bold text-[#ff3b30] leading-loose truncate">$0.00</div>
                </div>
                <div class="text-right">
                    <div class="text-[10px] text-gray-400 font-bold uppercase mb-1">Balance</div>
                    <div id="monthly-balance" class="text-sm font-bold text-gray-800 leading-loose truncate">$0.00</div>
                </div>
            </div>
            
            <div id="category-list" class="space-y-3 max-h-48 overflow-y-auto pr-2 pt-2 border-t border-gray-100">
                <div class="text-sm text-center text-gray-400 py-4 italic">Authenticating and loading...</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, setDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // =========================================================================
        // Environment Configuration
        // =========================================================================
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'expense-tracker-app';
        let firebaseConfig = null;
        try {
            firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        } catch (e) {
            console.error("Invalid firebase config");
        }

        const app = initializeApp(firebaseConfig || {});
        const auth = getAuth(app);
        const db = getFirestore(app);
        let currentUser = null;
        let unsubscribeExpenses = null;
        let unsubscribeIncome = null;

        // =========================================================================
        // Application State
        // =========================================================================
        let expenses = {}; 
        let incomeData = {}; // Stores income by month, e.g., { "2026-03": 5000 }
        let currentDate = new Date(); 
        let currentMonth = currentDate.getMonth();
        let currentYear = currentDate.getFullYear();
        let selectedDateStr = formatDate(currentDate);

        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

        // =========================================================================
        // UI Helpers
        // =========================================================================
        function showToast(message, type = 'error') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgClass = type === 'error' ? 'bg-red-500' : 'bg-gray-800';
            const iconClass = type === 'success' ? 'bg-green-500' : bgClass;
            
            toast.className = `${iconClass} text-white px-4 py-2 rounded-lg shadow-lg text-sm transition-opacity duration-300 opacity-0`;
            toast.innerText = message;
            container.appendChild(toast);

            void toast.offsetWidth; // Reflow
            toast.classList.remove('opacity-0');

            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function formatDate(date) {
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        function formatCurrency(amount) {
            const isNegative = amount < 0;
            const absAmount = Math.abs(amount);
            return (isNegative ? '-' : '') + '$' + absAmount.toFixed(2);
        }

        function formatCompactCurrency(amount) {
            if (amount >= 1000) return '$' + (amount / 1000).toFixed(1) + 'k';
            return '$' + Math.round(amount);
        }

        // =========================================================================
        // Authentication & Realtime Database
        // =========================================================================
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth error:", error);
                showToast("Failed to authenticate.");
            }
        };

        initAuth();

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                setupRealtimeListeners(user.uid);
            } else {
                if (unsubscribeExpenses) unsubscribeExpenses();
                if (unsubscribeIncome) unsubscribeIncome();
                expenses = {};
                incomeData = {};
                renderCalendar();
                updateSelectedDayUI();
                updateDailyExpensesUI();
                updateMonthlySummaryUI();
                document.getElementById('category-list').innerHTML = '<div class="text-sm text-center text-gray-400 py-4 italic">Signed out.</div>';
            }
        });

        function setupRealtimeListeners(userId) {
            if (unsubscribeExpenses) unsubscribeExpenses();
            if (unsubscribeIncome) unsubscribeIncome();
            
            // 1. Listen to Expenses
            const expensesRef = collection(db, 'artifacts', appId, 'users', userId, 'expenses');
            unsubscribeExpenses = onSnapshot(expensesRef, (snapshot) => {
                expenses = {}; 
                let tempExpenses = [];

                snapshot.forEach((document) => {
                    tempExpenses.push({ id: document.id, ...document.data() });
                });

                tempExpenses.sort((a, b) => a.createdAt - b.createdAt);

                tempExpenses.forEach(data => {
                    if (!expenses[data.date]) {
                        expenses[data.date] = [];
                    }
                    expenses[data.date].push({ id: data.id, category: data.category, amount: data.amount });
                });
                
                renderCalendar();
                updateSelectedDayUI();
                updateDailyExpensesUI();
                updateMonthlySummaryUI();
            }, (error) => {
                console.error("Snapshot error:", error);
                showToast("Error reading expenses.");
            });

            // 2. Listen to Income
            const incomeRef = collection(db, 'artifacts', appId, 'users', userId, 'income');
            unsubscribeIncome = onSnapshot(incomeRef, (snapshot) => {
                incomeData = {};
                snapshot.forEach(doc => {
                    // Document ID is formatted as "YYYY-MM"
                    incomeData[doc.id] = doc.data().amount || 0;
                });
                updateMonthlySummaryUI();
            }, (error) => {
                console.error("Income snapshot error:", error);
                showToast("Error reading income data.");
            });
        }

        // =========================================================================
        // Application Logic
        // =========================================================================
        window.changeMonth = function(direction) {
            currentMonth += direction;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            window.selectDate(new Date(currentYear, currentMonth, 1));
        };

        window.selectDate = function(dateObj) {
            currentDate = dateObj;
            selectedDateStr = formatDate(currentDate);
            renderCalendar();
            updateSelectedDayUI();
            updateDailyExpensesUI();
        };

        window.toggleCustomCategory = function() {
            const categorySelect = document.getElementById('expense-category');
            const customInput = document.getElementById('custom-category');
            if (categorySelect.value === 'Other') {
                customInput.classList.remove('hidden');
                customInput.focus();
            } else {
                customInput.classList.add('hidden');
                customInput.value = '';
            }
        };

        window.addExpense = async function() {
            if (!currentUser) {
                showToast("Please wait for authentication to complete.");
                return;
            }

            const categorySelect = document.getElementById('expense-category');
            const customInput = document.getElementById('custom-category');
            const amountInput = document.getElementById('expense-amount');
            
            let category = categorySelect.value;
            if (category === 'Other') {
                const customVal = customInput.value.trim();
                category = customVal !== '' ? customVal : 'Other';
            }

            const amount = parseFloat(amountInput.value);

            if (isNaN(amount) || amount <= 0) {
                amountInput.classList.add('border-red-500', 'animate-pulse');
                setTimeout(() => amountInput.classList.remove('border-red-500', 'animate-pulse'), 1000);
                return;
            }

            try {
                const expensesRef = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'expenses');
                await addDoc(expensesRef, {
                    date: selectedDateStr,
                    category: category,
                    amount: amount,
                    createdAt: Date.now() 
                });

                amountInput.value = '';
                customInput.value = '';
                customInput.classList.add('hidden');
                categorySelect.value = 'Food/Drinks'; 
            } catch (error) {
                console.error("Error adding document: ", error);
                showToast("Failed to save expense. Please try again.");
            }
        };

        window.deleteExpense = async function(index) {
            if (!currentUser) return;
            const exp = expenses[selectedDateStr][index];
            if (!exp || !exp.id) return;

            try {
                const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'expenses', exp.id);
                await deleteDoc(docRef);
            } catch (error) {
                console.error("Error deleting document: ", error);
                showToast("Failed to delete expense.");
            }
        };

        window.saveIncome = async function() {
            if (!currentUser) return;
            const targetMonthPrefix = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;
            const incomeInput = document.getElementById('monthly-income');
            const amount = parseFloat(incomeInput.value) || 0;

            try {
                // Save income using a specific doc ID for the month "YYYY-MM"
                const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'income', targetMonthPrefix);
                await setDoc(docRef, { 
                    amount: amount, 
                    updatedAt: Date.now() 
                });
                showToast("Income saved successfully!", "success");
            } catch (error) {
                console.error("Error saving income: ", error);
                showToast("Failed to save income.");
            }
        };

        document.getElementById('expense-amount').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') window.addExpense();
        });

        // =========================================================================
        // Render Functions
        // =========================================================================
        function renderCalendar() {
            document.getElementById('month-display').innerText = monthNames[currentMonth];
            document.getElementById('year-display').innerText = currentYear;
            
            const yearDisplay = document.getElementById('year-display');
            if (currentYear !== new Date().getFullYear()) {
                yearDisplay.classList.remove('hidden');
            } else {
                yearDisplay.classList.add('hidden');
            }

            const daysContainer = document.getElementById('calendar-days');
            daysContainer.innerHTML = '';

            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                const emptySlot = document.createElement('div');
                daysContainer.appendChild(emptySlot);
            }

            for (let i = 1; i <= daysInMonth; i++) {
                const dayDate = new Date(currentYear, currentMonth, i);
                const dayStr = formatDate(dayDate);
                const isSelected = dayStr === selectedDateStr;
                const hasExpenses = expenses[dayStr] && expenses[dayStr].length > 0;
                
                let dailyTotal = 0;
                if (hasExpenses) {
                    dailyTotal = expenses[dayStr].reduce((sum, item) => sum + item.amount, 0);
                }

                const dayBtn = document.createElement('button');
                dayBtn.onclick = () => window.selectDate(dayDate);
                
                // Adjusted calendar button height and layout to accommodate the daily total
                let classes = "relative w-full h-10 flex flex-col items-center justify-center rounded-lg text-[14px] transition-all duration-200 outline-none ";
                
                if (isSelected) {
                    classes += "bg-[#ff3b30] text-white shadow-md transform scale-105 font-bold ";
                } else {
                    classes += "text-gray-700 hover:bg-gray-200";
                }

                dayBtn.className = classes;
                
                // Content of the day cell
                let contentHtml = `<span class="${dailyTotal > 0 ? 'mt-1' : ''}">${i}</span>`;
                
                if (dailyTotal > 0) {
                    const textColorClass = isSelected ? "text-red-100" : "text-gray-400";
                    contentHtml += `<span class="text-[9px] font-semibold tracking-tighter ${textColorClass} mt-0.5 leading-none">${formatCompactCurrency(dailyTotal)}</span>`;
                }
                
                dayBtn.innerHTML = contentHtml;
                daysContainer.appendChild(dayBtn);
            }
        }

        function updateSelectedDayUI() {
            const dayName = dayNames[currentDate.getDay()];
            const monthName = monthNames[currentDate.getMonth()];
            const dayNum = currentDate.getDate();
            document.getElementById('selected-date-text').innerText = `${dayName}, ${monthName} ${dayNum}`;

            let dailyTotal = 0;
            if (expenses[selectedDateStr]) {
                dailyTotal = expenses[selectedDateStr].reduce((sum, item) => sum + item.amount, 0);
            }
            document.getElementById('daily-total').innerText = formatCurrency(dailyTotal);
        }

        function updateDailyExpensesUI() {
            const listContainer = document.getElementById('daily-expense-list');
            listContainer.innerHTML = ''; 

            const dailyExps = expenses[selectedDateStr] || [];
            
            if (dailyExps.length === 0) {
                listContainer.innerHTML = '<li class="text-sm text-center text-gray-400 py-2 italic">No expenses for this day.</li>';
                return;
            }

            dailyExps.forEach((exp, index) => {
                const li = document.createElement('li');
                li.className = "flex justify-between items-center text-sm bg-gray-50 px-3 py-2 rounded-md border border-gray-100";
                li.innerHTML = `
                    <span class="text-gray-700 font-medium">${exp.category}</span>
                    <div class="flex items-center space-x-3">
                        <span class="font-semibold text-gray-800">${formatCurrency(exp.amount)}</span>
                        <button onclick="window.deleteExpense(${index})" class="text-gray-400 hover:text-red-500 focus:outline-none transition-colors pointer-events-auto" title="Delete">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                `;
                listContainer.appendChild(li);
            });
        }

        function updateMonthlySummaryUI() {
            const listContainer = document.getElementById('category-list');
            listContainer.innerHTML = ''; 

            let monthlyTotal = 0;
            const categoryTotals = {};
            const targetMonthPrefix = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;

            // Calculate Monthly Total
            for (const dateStr in expenses) {
                if (dateStr.startsWith(targetMonthPrefix)) {
                    expenses[dateStr].forEach(expense => {
                        monthlyTotal += expense.amount;
                        if (!categoryTotals[expense.category]) {
                            categoryTotals[expense.category] = 0;
                        }
                        categoryTotals[expense.category] += expense.amount;
                    });
                }
            }

            // Grab Monthly Income
            const monthlyIncome = incomeData[targetMonthPrefix] || 0;
            const incomeInput = document.getElementById('monthly-income');
            
            // Only update the income input if the user isn't currently typing in it
            if (document.activeElement !== incomeInput) {
                incomeInput.value = monthlyIncome > 0 ? monthlyIncome : '';
            }

            document.getElementById('monthly-total').innerText = formatCurrency(monthlyTotal);

            // Calculate Balance
            const balance = monthlyIncome - monthlyTotal;
            const balanceEl = document.getElementById('monthly-balance');
            balanceEl.innerText = formatCurrency(balance);
            
            // Set balance color
            if (balance < 0) {
                balanceEl.className = "text-sm font-bold text-[#ff3b30] leading-loose truncate"; // Red
            } else if (balance > 0) {
                balanceEl.className = "text-sm font-bold text-green-600 leading-loose truncate"; // Green
            } else {
                balanceEl.className = "text-sm font-bold text-gray-800 leading-loose truncate"; // Neutral
            }

            // Render Category List
            const categories = Object.keys(categoryTotals);
            if (categories.length === 0) {
                listContainer.innerHTML = '<div class="text-sm text-center text-gray-400 py-4 italic">No expenses recorded this month.</div>';
                return;
            }

            categories.sort((a, b) => categoryTotals[b] - categoryTotals[a]);

            categories.forEach(cat => {
                const total = categoryTotals[cat];
                const percentage = monthlyTotal > 0 ? ((total / monthlyTotal) * 100).toFixed(0) : 0;
                
                const itemDiv = document.createElement('div');
                itemDiv.className = "flex justify-between items-center text-sm";
                itemDiv.innerHTML = `
                    <div class="flex items-center space-x-2 flex-1">
                        <div class="w-2 h-2 rounded-full bg-gray-300"></div>
                        <span class="text-gray-700 font-medium">${cat}</span>
                        <span class="text-xs text-gray-400">${percentage}%</span>
                    </div>
                    <div class="font-semibold text-gray-800">${formatCurrency(total)}</div>
                `;
                listContainer.appendChild(itemDiv);
            });
        }

        window.exportToCSV = function() {
            const targetMonthPrefix = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;
            let csvContent = "data:text/csv;charset=utf-8,Date,Category,Amount\n";
            let hasData = false;

            const sortedDates = Object.keys(expenses).sort();

            for (const dateStr of sortedDates) {
                if (dateStr.startsWith(targetMonthPrefix)) {
                    expenses[dateStr].forEach(exp => {
                        hasData = true;
                        csvContent += `${dateStr},"${exp.category}",${exp.amount.toFixed(2)}\n`;
                    });
                }
            }

            if (!hasData) {
                showToast(`No data to export for ${monthNames[currentMonth]} ${currentYear}`);
                return;
            }

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Expenses_${monthNames[currentMonth]}_${currentYear}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        // Initial setup
        renderCalendar();
        updateSelectedDayUI();
    </script>
</body>
</html>
